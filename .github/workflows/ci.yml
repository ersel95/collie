name: CI

# Runs on every push and pull request. Each platform only runs when its own files changed,
# so an Android-only commit does not spend twenty minutes on a macOS runner.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Did iOS change?
        id: changes
        run: |
          if git diff --quiet HEAD^ HEAD -- Sources Tests Package.swift 2>/dev/null; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.changes.outputs.run == 'true'
        with:
          xcode-version: latest-stable

      - name: Run tests
        if: steps.changes.outputs.run == 'true'
        run: swift test

      - name: Build for iOS simulator
        if: steps.changes.outputs.run == 'true'
        run: |
          swift build \
            --triple arm64-apple-ios17.0-simulator \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :collie:testDebugUnitTest --no-daemon

      - name: Build everything, both ways
        run: |
          # The same gate the release runs: real artifact and no-op, example and sample.
          ./gradlew :collie:assembleRelease :collie-firebase:assembleRelease \
            :collie-no-op:assembleRelease --no-daemon
          ./gradlew :sample:assembleDebug :example:assembleDebug --no-daemon
          ./gradlew :sample:assembleDebug -PcollieNoOp=true --no-daemon
          ./gradlew :example:assembleRelease --no-daemon
