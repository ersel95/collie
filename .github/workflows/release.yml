name: Release

# Pushing a semver tag (e.g. 0.3.0) runs the test suite and, when green, publishes a
# GitHub release whose notes are the matching section of CHANGELOG.md.
#
# Release flow:
#   1. Add a "## <version> — <date>" section to CHANGELOG.md and commit it.
#   2. git tag <version> && git push origin <version>
#   3. This workflow does the rest. It fails fast if the CHANGELOG section is missing.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Run tests (macOS)
        run: swift test

      - name: Build for iOS simulator
        run: |
          swift build \
            --triple arm64-apple-ios17.0-simulator \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"

      - name: Extract release notes from CHANGELOG.md
        run: |
          # Grab the section that starts with "## <tag> " (headings are
          # "## <version> — <date>", so the trailing space avoids prefix collisions
          # like 0.2.1 vs 0.2.10) up to the next "## " heading.
          awk -v ver="$GITHUB_REF_NAME" '
            !grab && index($0, "## " ver " ") == 1 { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > release-notes.md
          if ! [ -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for $GITHUB_REF_NAME — add '## $GITHUB_REF_NAME — <date>' and re-tag." >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "Collie $GITHUB_REF_NAME" \
            --notes-file release-notes.md
