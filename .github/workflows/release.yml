name: Release

# Two platforms, two version lines, one workflow.
#
#   iOS      tag "1.12.0"          → tests + simulator build → GitHub release
#   Android  tag "android-0.1.0"   → unit tests + all three artifacts + the example and
#                                     sample apps compiled against each → release with AARs
#
# `android-*` tags are not semver, so Swift Package Manager ignores them entirely and the
# iOS version line stays clean no matter how often Android ships.
#
# Release flow (either platform):
#   1. Add a "## <version> — <date>" section to the platform's CHANGELOG and commit it.
#      iOS: /CHANGELOG.md · Android: /Android/CHANGELOG.md (+ bump `localVersion` in
#      Android/build.gradle.kts so local builds match).
#   2. git tag <version> && git push origin <version>
#   3. This workflow does the rest. It fails fast if the CHANGELOG section is missing.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "android-[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  ios:
    if: ${{ !startsWith(github.ref_name, 'android-') }}
    # macos-14 defaults to Xcode 15 / Swift 5.10, which cannot parse the `sending`
    # keyword firebase-ios-sdk uses — every release since CollieFirebase was added
    # (1.1.0) failed there while building fine locally on Swift 6.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: swift --version

      - name: Run tests (macOS)
        run: swift test

      - name: Build for iOS simulator
        run: |
          swift build \
            --triple arm64-apple-ios17.0-simulator \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"

      - name: Extract release notes from CHANGELOG.md
        run: |
          # Grab the section that starts with "## <tag> " (headings are
          # "## <version> — <date>", so the trailing space avoids prefix collisions
          # like 0.2.1 vs 0.2.10) up to the next "## " heading.
          awk -v ver="$GITHUB_REF_NAME" '
            !grab && index($0, "## " ver " ") == 1 { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > changelog-section.md
          if ! [ -s changelog-section.md ]; then
            echo "::error::No CHANGELOG.md section found for $GITHUB_REF_NAME — add '## $GITHUB_REF_NAME — <date>' and re-tag." >&2
            exit 1
          fi

          # Both platforms release from this repository, so every release says up front which
          # one it is and how to install it — the tag alone does not, and the "Latest" badge
          # belongs to whichever platform shipped most recently.
          {
            echo "**iOS** · Swift Package Manager · [Android releases](https://github.com/ersel95/collie/releases?q=android)"
            echo
            echo '```swift'
            echo ".package(url: \"https://github.com/ersel95/collie.git\", from: \"$GITHUB_REF_NAME\")"
            echo '```'
            echo
            echo "---"
            echo
            cat changelog-section.md
          } > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping."
            exit 0
          fi
          # "iOS 1.13.0", not "Collie 1.13.0": the list holds both platforms, and the title is
          # the only thing that distinguishes them at a glance.
          gh release create "$GITHUB_REF_NAME" \
            --title "iOS $GITHUB_REF_NAME" \
            --notes-file release-notes.md

  android:
    if: ${{ startsWith(github.ref_name, 'android-') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version must match the CHANGELOG
        run: |
          # The tag is what JitPack builds and what consumers write in their build file, so a
          # CHANGELOG that disagrees with it is a release that lies about itself.
          version="${GITHUB_REF_NAME#android-}"
          if ! grep -q "^## $version " CHANGELOG.md; then
            echo "::error::No Android/CHANGELOG.md section found for $version — add '## $version — <date>' and re-tag." >&2
            exit 1
          fi

      - name: Run unit tests
        run: ./gradlew :collie:testDebugUnitTest --no-daemon

      - name: Build the artifacts
        run: |
          version="${GITHUB_REF_NAME#android-}"
          ./gradlew :collie:assembleRelease :collie-firebase:assembleRelease \
            :collie-no-op:assembleRelease -Pversion="$version" --no-daemon

      - name: API-compatibility gate
        run: |
          # The example and the sample both have to compile against the real artifact AND
          # against the no-op. A signature that drifts between the two breaks the host's
          # release build, which is the worst place to find out — it already caught one
          # missing member (`captureExclusionFragments`) before Android ever shipped.
          ./gradlew :sample:assembleDebug :example:assembleDebug --no-daemon
          ./gradlew :sample:assembleDebug -PcollieNoOp=true --no-daemon
          ./gradlew :example:assembleRelease --no-daemon

      - name: Extract release notes from Android/CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#android-}"
          awk -v ver="$version" '
            !grab && index($0, "## " ver " ") == 1 { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > changelog-section.md

          # Same header as the iOS job, from the other side: which platform, and the exact
          # coordinates to paste. The version is the tag, so it is copied verbatim.
          {
            echo "**Android** · JitPack · [iOS releases](https://github.com/ersel95/collie/releases)"
            echo
            echo '```kotlin'
            echo "debugImplementation(\"com.github.ersel95.collie:collie:$GITHUB_REF_NAME\")"
            echo "releaseImplementation(\"com.github.ersel95.collie:collie-no-op:$GITHUB_REF_NAME\")"
            echo "// Firestore transport (optional):"
            echo "debugImplementation(\"com.github.ersel95.collie:collie-firebase:$GITHUB_REF_NAME\")"
            echo '```'
            echo
            echo "---"
            echo
            cat changelog-section.md
          } > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping."
            exit 0
          fi
          # "Android 0.2.0" — the tag already carries the `android-` prefix, so repeating it in
          # the title ("Collie for Android android-0.2.0") just made it harder to read.
          version="${GITHUB_REF_NAME#android-}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Android $version" \
            --notes-file release-notes.md \
            collie/build/outputs/aar/collie-release.aar \
            collie-firebase/build/outputs/aar/collie-firebase-release.aar \
            collie-no-op/build/outputs/aar/collie-no-op-release.aar
